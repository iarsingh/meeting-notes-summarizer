apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeting-notes-summarizer
  labels:
    app: meeting-notes-summarizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meeting-notes-summarizer
  template:
    metadata:
      labels:
        app: meeting-notes-summarizer
    spec:
      containers:
        - name: api
          image: meeting-notes-summarizer:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: meeting-notes-summarizer
spec:
  selector:
    app: meeting-notes-summarizer
  ports:
    - port: 80
      targetPort: 8080
